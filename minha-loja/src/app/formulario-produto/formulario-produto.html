<div class="formulario">
  <h2>Cadastro de Produto</h2>

  <!-- a) Interpolação -->
  <p>Você está cadastrando: {{ nome }}</p>

  <!-- d) Two-way binding com ngModel -->
  <label>Nome:</label>
  <input type="text" [(ngModel)]="nome" placeholder="Nome do produto">


  <label>Preço:</label>
  <input type="number" [(ngModel)]="preco" placeholder="Preço">

  <!-- b) Property binding + c) Event binding -->
  <button [disabled]="nome === ''" (click)="salvar()">Salvar</button>
</div>

<!-- f) Lista de produtos cadastrados -->
<div class="lista">
  <h3>Produtos cadastrados</h3>
  @for (produto of produtos; track produto.nome) {
    <!-- e) Class binding -->
    <p [class.caro]="produto.preco > 500">
      {{ produto.preco | currency:'BRL' }} -  {{ produto.nome }} - {{ produto.preco > 500 ? 'Caro' : 'Barato'   }}
    </p>
  }
</div>
